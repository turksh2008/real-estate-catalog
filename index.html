<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة العقارات - Property Management</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
    .hero-bg { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
    .whatsapp-btn { background-color: #25d366 !important; color: #fff !important; font-weight: 700; border: none; }
    .property-card { border-radius: 12px; border: 1px solid #e2e8f0; background: #fff; }
    .table-container { background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .form-container { background: #fff; padding: 2rem; border-radius: 12px; max-width: 700px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header Hero Section -->
    <section class="hero hero-bg is-small">
      <div class="hero-body">
        <div class="container">
          <div class="is-flex is-justify-content-space-between is-align-items-center mb-3">
            <div>
              <h1 class="title has-text-white is-size-3 mb-1">
                <span class="material-icons" style="vertical-align: middle;">domain</span> إدارة العقارات
              </h1>
            </div>
            <a href="https://wa.me/96894249942" target="_blank" class="button whatsapp-btn is-rounded">
              <span class="material-icons ml-1">chat</span>
              <span>تواصل معنا</span>
            </a>
          </div>

          <!-- Navigation Tabs -->
          <div class="tabs is-toggle is-fullwidth is-small mt-4">
            <ul>
              <li :class="{'is-active': activeTab === 'catalog'}">
                <a @click="activeTab = 'catalog'">
                  <span class="material-icons ml-1">grid_view</span> المعرض (Catalog)
                </a>
              </li>
              <li :class="{'is-active': activeTab === 'table'}">
                <a @click="activeTab = 'table'">
                  <span class="material-icons ml-1">table_chart</span> الجدول (Table)
                </a>
              </li>
              <li :class="{'is-active': activeTab === 'form'}">
                <a @click="activeTab = 'form'">
                  <span class="material-icons ml-1">add_circle</span> إضافة عقار (Add Form)
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <!-- Main Content Body -->
    <section class="section py-5">
      <div class="container">

        <!-- Loading Spinner -->
        <div v-if="loading" class="has-text-centered py-6">
          <button class="button is-loading is-large is-white" style="border:none;"></button>
          <p class="has-text-grey mt-2">جاري التحميل...</p>
        </div>

        <template v-else>
          <!-- 1. CATALOG VIEW -->
          <div v-if="activeTab === 'catalog'" class="columns is-multiline">
            <div v-for="item in properties" :key="item.id" class="column is-12-mobile is-6-tablet is-4-desktop">
              <div class="property-card p-4">
                <h3 class="title is-5 mb-2">{{item.title}}</h3>
                <p class="subtitle is-6 has-text-primary">OMR {{Number(item.price || 0).toLocaleString()}}</p>
                <p class="has-text-grey">{{item.location}}</p>
              </div>
            </div>
          </div>

          <!-- 2. TABLE VIEW -->
          <div v-if="activeTab === 'table'" class="table-container">
            <h2 class="title is-4 mb-4">قائمة العقارات (Listings Table)</h2>
            <div class="table-container">
              <table class="table is-fullwidth is-striped is-hoverable">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>العنوان (Title)</th>
                    <th>النوع (Type)</th>
                    <th>السعر (Price)</th>
                    <th>الموقع (Location)</th>
                    <th>الحالة (Status)</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="item in properties" :key="item.id">
                    <td>{{item.id}}</td>
                    <td><strong>{{item.title}}</strong></td>
                    <td>{{item.propertyType}}</td>
                    <td>OMR {{Number(item.price || 0).toLocaleString()}}</td>
                    <td>{{item.location}}</td>
                    <td>
                      <span class="tag" :class="item.status === 'Available' ? 'is-success' : 'is-danger'">
                        {{item.status || 'Available'}}
                      </span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- 3. ADD PROPERTY FORM VIEW -->
          <div v-if="activeTab === 'form'" class="form-container">
            <h2 class="title is-4 mb-4">إضافة عقار جديد (Add New Property)</h2>
            <form @submit.prevent="submitForm">
              <div class="field">
                <label class="label">عنوان العقار (Title)</label>
                <div class="control">
                  <input class="input" type="text" v-model="formData.title" required placeholder="مثال: فيلا للبيع في المعبيلة">
                </div>
              </div>

              <div class="columns">
                <div class="column">
                  <div class="field">
                    <label class="label">نوع العقار (Property Type)</label>
                    <div class="control">
                      <div class="select is-fullwidth">
                        <select v-model="formData.propertyType">
                          <option value="Villa">فيلا (Villa)</option>
                          <option value="Apartment">شقة (Apartment)</option>
                          <option value="Land">أرض (Land)</option>
                        </select>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="column">
                  <div class="field">
                    <label class="label">السعر (Price in OMR)</label>
                    <div class="control">
                      <input class="input" type="number" v-model="formData.price" required placeholder="50000">
                    </div>
                  </div>
                </div>
              </div>

              <div class="field">
                <label class="label">الموقع (Location)</label>
                <div class="control">
                  <input class="input" type="text" v-model="formData.location" required placeholder="السيب، مسقط">
                </div>
              </div>

              <div class="field">
                <label class="label">روابط الصور (Image URLs - Comma separated)</label>
                <div class="control">
                  <textarea class="textarea" v-model="formData.images" rows="2" placeholder="https://example.com/image1.jpg, https://example.com/image2.jpg"></textarea>
                </div>
              </div>

              <div class="field">
                <label class="label">الوصف (Description)</label>
                <div class="control">
                  <textarea class="textarea" v-model="formData.description" rows="3"></textarea>
                </div>
              </div>

              <button class="button is-primary is-fullwidth mt-4" :class="{'is-loading': submitting}" type="submit">
                حفظ العقار (Save Property)
              </button>
            </form>
          </div>
        </template>
      </div>
    </section>
  </div>

  <script>
    new Vue({
      el: '#app',
      data: {
        webAppUrl: 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID_HERE/exec',
        activeTab: 'catalog',
        properties: [],
        loading: true,
        submitting: false,
        formData: {
          title: '',
          propertyType: 'Villa',
          price: '',
          location: '',
          images: '',
          description: ''
        }
      },
      methods: {
        fetchProperties() {
          this.loading = true;
          fetch(this.webAppUrl)
            .then(res => res.json())
            .then(data => {
              this.properties = data || [];
              this.loading = false;
            })
            .catch(err => {
              console.error('Fetch error:', err);
              this.loading = false;
            });
        },
        submitForm() {
          this.submitting = true;
          fetch(this.webAppUrl, {
            method: 'POST',
            body: JSON.stringify(this.formData)
          })
          .then(res => res.json())
          .then(res => {
            this.submitting = false;
            alert('تمت إضافة العقار بنجاح!');
            this.formData = { title: '', propertyType: 'Villa', price: '', location: '', images: '', description: '' };
            this.fetchProperties();
            this.activeTab = 'table';
          })
          .catch(err => {
            this.submitting = false;
            alert('حدث خطأ أثناء الحفظ');
            console.error(err);
          });
        }
      },
      mounted() {
        this.fetchProperties();
      }
    });
  </script>
</body>
</html>
